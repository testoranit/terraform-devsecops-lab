name: Terraform Dev Plan Only

on:
  push:
    branches:
      - dev

jobs:
  terraform-plan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.2

      - name: Terraform Init
        run: terraform init
        working-directory: envs/dev

      - name: Terraform Plan Only (NO APPLY)
        run: terraform plan

